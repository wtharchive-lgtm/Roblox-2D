<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>2D Roblox Prototype</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #151a22; }
  body { overscroll-behavior: none; user-select: none; -webkit-user-select: none; touch-action: none; }
  #game { display: block; width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; }
  /* Small asset controls replace the old large title/instructions popup. */
  .asset-tools { position: fixed; z-index: 6; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); display: flex; gap: 6px; align-items: flex-start; }
  .asset-tools button { border: 1px solid #ffffff55; border-radius: 9px; padding: 8px 10px; color: #fff; background: #111827b8; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); font-size: 11px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
  .asset-tools button:active { background: #36445c; }
  #assetPicker, #assetFilesPicker { display: none; }
  #assetStatus, #assetWarning { display: none; position: fixed; z-index: 6; left: max(12px, env(safe-area-inset-left)); top: max(52px, calc(env(safe-area-inset-top) + 44px)); max-width: min(92vw, 440px); padding: 7px 10px; border-radius: 8px; color: #fff; background: #111827dd; font-size: 11px; line-height: 1.35; pointer-events: none; }
  #assetWarning { top: max(52px, calc(env(safe-area-inset-top) + 44px)); color: #ffd28a; }
  .touch-controls { display: none; position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .joystick-area { pointer-events: auto; touch-action: none; position: absolute; left: max(20px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom)); width: 142px; height: 142px; border-radius: 50%; background: #0c132c55; border: 2px solid #ffffff66; box-shadow: inset 0 0 0 1px #0003, 0 3px 18px #0002; }
  .joystick-area::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; border-radius: 50%; background: #ffffff55; transform: translate(-50%, -50%); }
  .joystick-knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; border-radius: 50%; transform: translate(-50%, -50%); background: #eaf2ffbd; border: 2px solid #fff; box-shadow: 0 4px 12px #0004; pointer-events: none; }
  .jump-button { pointer-events: auto; touch-action: none; position: absolute; right: max(24px, env(safe-area-inset-right)); bottom: max(35px, env(safe-area-inset-bottom)); width: 94px; height: 94px; border-radius: 50%; border: 2px solid #ffffffdc; background: #2476dfc9; color: #fff; font-size: 17px; font-weight: 800; letter-spacing: .6px; box-shadow: 0 5px 18px #0004, inset 0 0 0 4px #ffffff20; }
  .jump-button:active { background: #4b99ffed; transform: scale(.96); }
  .rotate-hint { position: absolute; right: max(24px, env(safe-area-inset-right)); bottom: max(140px, calc(env(safe-area-inset-bottom) + 140px)); color: #ffffffb5; font-size: 11px; text-shadow: 0 1px 3px #000; }
  .name-panel { position: fixed; z-index: 6; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; border: 1px solid #ffffff55; border-radius: 10px; background: #111827bd; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); max-width: min(52vw, 340px); }
  .name-panel label { color: #fff; font-size: 11px; white-space: nowrap; }
  #characterName { width: clamp(90px, 17vw, 190px); min-width: 0; border: 1px solid #ffffff44; border-radius: 6px; padding: 7px 8px; color: #fff; background: #0b1020dd; font: inherit; font-size: 12px; user-select: text; -webkit-user-select: text; touch-action: auto; }
  .reset-button { position: fixed; z-index: 6; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); border: 1px solid #ffffff55; border-radius: 10px; padding: 9px 12px; color: white; background: #111827bd; font-size: 12px; }
  .reset-button:active { background: #36445c; }
  @media (pointer: coarse), (max-width: 800px) { .touch-controls { display: block; } }
  @media (max-width: 480px) { .name-panel { top: max(58px, calc(env(safe-area-inset-top) + 56px)); max-width: 72vw; } .asset-tools button { padding: 7px 8px; font-size: 10px; } .joystick-area { width: 126px; height: 126px; } .joystick-knob { width: 52px; height: 52px; } .jump-button { width: 82px; height: 82px; font-size: 15px; } .rotate-hint { bottom: max(125px, calc(env(safe-area-inset-bottom) + 125px)); } }
</style>
</head>
<body>
<canvas id="game" aria-label="2D Roblox prototype game area"></canvas>
<div class="asset-tools" aria-label="Asset controls">
  <button id="chooseAssetsButton" type="button">Load assets</button>
  <button id="chooseFilesButton" type="button">Choose files</button>
  <input id="assetPicker" type="file" multiple webkitdirectory directory />
  <input id="assetFilesPicker" type="file" accept="image/*,audio/mpeg,audio/mp3,.mp3" multiple />
</div>
<span id="assetStatus" role="status">Loading PNG assets…</span>
<span id="assetWarning" role="status"></span>
<div class="name-panel"><label for="characterName">Name</label><input id="characterName" type="text" maxlength="20" placeholder="Noob" value="Noob" autocomplete="off" /></div>
<button class="reset-button" id="resetButton" type="button">Reset player</button>
<div class="touch-controls" aria-label="Touch controls">
  <div class="joystick-area" id="joystick" aria-label="Movement joystick">
    <div class="joystick-knob" id="joystickKnob"></div>
  </div>
  <div class="rotate-hint">Stick down = approach camera</div>
  <button class="jump-button" id="jumpButton" type="button" aria-label="Jump">JUMP</button>
</div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const warning = document.getElementById('assetWarning');
  const assetStatus = document.getElementById('assetStatus');
  const chooseAssetsButton = document.getElementById('chooseAssetsButton');
  const assetPicker = document.getElementById('assetPicker');
  const chooseFilesButton = document.getElementById('chooseFilesButton');
  const assetFilesPicker = document.getElementById('assetFilesPicker');
  const joystick = document.getElementById('joystick');
  const joystickKnob = document.getElementById('joystickKnob');
  const jumpButton = document.getElementById('jumpButton');
  const resetButton = document.getElementById('resetButton');
  const characterNameInput = document.getElementById('characterName');

  const assetPaths = {
    baseplate: 'Assets/Background/Baseplate.png',
    front: 'Assets/Noob/Front.png',
    back: 'Assets/Noob/Back.png',
    left: 'Assets/Noob/Left.png',
    right: 'Assets/Noob/Right.png',
    jumpFront: 'Assets/Noob/JumpFront.png',
    jumpBack: 'Assets/Noob/JumpBack.png'
  };
  const soundPaths = { walk: 'Assets/Sounds/walk.mp3', jump: 'Assets/Sounds/jump.mp3', oof: 'Assets/Sounds/oof.mp3' };
  const images = {};
  const sounds = {};
  const loadedAssets = new Set();
  const failedAssets = new Map();
  const objectUrls = new Map();

  function updateAssetStatus() {
    const imageCount = [...loadedAssets].filter(key => !key.startsWith('sound:')).length;
    const soundCount = [...loadedAssets].filter(key => key.startsWith('sound:')).length;
    assetStatus.style.display = imageCount === 7 ? 'none' : 'block';
    if (imageCount !== 7) {
      assetStatus.textContent = `Images: ${imageCount}/7 loaded. Use Load assets or Choose files if needed.`;
    }
    if (failedAssets.size) {
      warning.style.display = 'block';
      warning.textContent = 'Missing/unreadable: ' + [...failedAssets.values()].join(', ');
    } else {
      warning.style.display = 'none';
      warning.textContent = '';
    }
    // Keep the sound count available for debugging without showing a permanent popup.
    assetStatus.dataset.sounds = `${soundCount}/3`;
  }

  function setAssetSource(key, source, label) {
    const img = new Image();
    images[key] = img;
    img.onload = () => {
      loadedAssets.add(key);
      failedAssets.delete(key);
      updateAssetStatus();
    };
    img.onerror = () => {
      loadedAssets.delete(key);
      failedAssets.set(key, label || assetPaths[key]);
      updateAssetStatus();
    };
    img.src = source;
  }

  function loadAsset(key, path) {
    setAssetSource(key, path, path);
  }
  Object.entries(assetPaths).forEach(([key, path]) => loadAsset(key, path));

  function setSoundSource(key, source, label) {
    const audio = new Audio();
    audio.preload = 'auto';
    if (key === 'walk') audio.loop = true;
    audio.src = source;
    audio.addEventListener('canplaythrough', () => { loadedAssets.add('sound:' + key); failedAssets.delete('sound:' + key); updateSoundStatus(); }, { once: true });
    audio.addEventListener('error', () => { loadedAssets.delete('sound:' + key); failedAssets.set('sound:' + key, label || soundPaths[key]); updateSoundStatus(); }, { once: true });
    sounds[key] = audio;
    audio.load();
  }
  function updateSoundStatus() { updateAssetStatus(); }

  Object.entries(soundPaths).forEach(([key, path]) => setSoundSource(key, path, path));

  let audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    // Playback is started only in response to a user gesture, as required by mobile browsers.
    Object.values(sounds).forEach(audio => { try { audio.load(); } catch (_) {} });
  }
  function playSound(key) {
    const audio = sounds[key];
    if (!audio) return;
    unlockAudio();
    if (key !== 'walk') { try { audio.currentTime = 0; } catch (_) {} }
    const promise = audio.play();
    if (promise && typeof promise.catch === 'function') promise.catch(() => {});
  }
  function updateWalkSound(isWalking) {
    const audio = sounds.walk;
    if (!audio) return;
    if (isWalking) {
      unlockAudio();
      if (audio.paused) { const promise = audio.play(); if (promise && promise.catch) promise.catch(() => {}); }
    } else if (!audio.paused) { audio.pause(); try { audio.currentTime = 0; } catch (_) {} }
  }

  // The HTML might be opened from Downloads or an Android file viewer, away from
  // the Assets directory. Let the player select the Assets folder (or select the
  // PNG files manually in browsers that do not support folder selection).
  chooseAssetsButton.addEventListener('click', () => assetPicker.click());
  chooseFilesButton.addEventListener('click', () => assetFilesPicker.click());
  function loadSelectedAssets(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    const normalize = value => String(value || '').replace(/\\/g, '/').toLowerCase();
    const missing = [];
    const allPaths = { ...assetPaths, ...soundPaths };
    for (const [key, path] of Object.entries(allPaths)) {
      const expected = path.replace(/^assets\//i, '').toLowerCase();
      const file = files.find(candidate => {
        const rel = normalize(candidate.webkitRelativePath || candidate.name);
        return rel === expected || rel.endsWith('/' + expected) || normalize(candidate.name) === expected.split('/').pop();
      });
      if (!file) {
        missing.push(expected);
        failedAssets.set(key.startsWith('sound:') ? key : (soundPaths[key] ? 'sound:' + key : key), expected);
        continue;
      }
      const isSound = Object.prototype.hasOwnProperty.call(soundPaths, key);
      const storageKey = isSound ? 'sound:' + key : key;
      const oldUrl = objectUrls.get(storageKey);
      if (oldUrl) URL.revokeObjectURL(oldUrl);
      const url = URL.createObjectURL(file);
      objectUrls.set(storageKey, url);
      if (isSound) setSoundSource(key, url, expected);
      else setAssetSource(key, url, expected);
    }
    if (missing.length) {
      warning.style.display = 'block';
      warning.textContent = 'Not found in selection: ' + missing.join(', ') + '. Select the Assets folder containing Noob, Background, and Sounds.';
    }
    updateAssetStatus();
  }
  assetPicker.addEventListener('change', () => loadSelectedAssets(assetPicker.files));
  assetFilesPicker.addEventListener('change', () => loadSelectedAssets(assetFilesPicker.files));

  let viewW = 0, viewH = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    viewW = Math.max(1, window.innerWidth);
    viewH = Math.max(1, window.innerHeight);
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', resize, { passive: true });
  resize();

  const player = {
    x: 0.5,
    y: 0.57,
    facing: 'front',
    jumping: false,
    jumpStarted: 0,
    jumpDuration: 620,
    jumpFacing: 'front'
  };
  const keys = Object.create(null);
  const joy = { active: false, pointerId: null, x: 0, y: 0 };
  const MOVE_SPEED_X = 0.43; // fraction of screen width per second
  const MOVE_SPEED_Y = 0.34; // fraction of screen height per second
  const MIN_X = 0.055, MAX_X = 0.945;
  const MIN_Y = 0.12, MAX_Y = 0.91;

  function getInput() {
    // PC remap: A approaches the camera, W moves away, S moves left, D moves right.
    // Arrow keys retain conventional directions; the touch joystick is unchanged.
    let x = (keys.d || keys.arrowright ? 1 : 0) - (keys.s || keys.arrowleft ? 1 : 0) + joy.x;
    let y = (keys.a || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0) + joy.y;
    const length = Math.hypot(x, y);
    if (length > 1) { x /= length; y /= length; }
    return { x, y };
  }

  function updateFacing(input) {
    const ax = Math.abs(input.x);
    const ay = Math.abs(input.y);
    // Prefer front/back when the stick is mostly vertical. Minor sideways wobble
    // should not switch the sprite; horizontal facing requires a clearly stronger X input.
    if (ax > 0.28 && ax > ay * 1.22) {
      player.facing = input.x < 0 ? 'left' : 'right';
    } else if (ay > 0.18) {
      player.facing = input.y > 0 ? 'front' : 'back';
    } else if (ax > 0.18) {
      player.facing = input.x < 0 ? 'left' : 'right';
    }
  }

  function startJump() {
    if (player.jumping) return;
    playSound('jump');
    const input = getInput();
    updateFacing(input); // handles a direction + Space pressed almost simultaneously
    player.jumping = true;
    player.jumpStarted = performance.now();
    player.jumpFacing = player.facing === 'back' ? 'back' : 'front';
  }

  function resetPlayer() {
    playSound('oof');
    player.x = 0.5;
    player.y = 0.57;
    player.facing = 'front';
    player.jumping = false;
    player.jumpStarted = 0;
    player.jumpFacing = 'front';
    joy.x = joy.y = 0;
    joy.active = false;
    joy.pointerId = null;
    joystickKnob.style.transform = 'translate(-50%, -50%)';
    Object.keys(keys).forEach(k => keys[k] = false);
  }
  resetButton.addEventListener('click', resetPlayer);

  function normalKey(key) { return key.length === 1 ? key.toLowerCase() : key.toLowerCase(); }
  window.addEventListener('keydown', event => {
    unlockAudio();
    const key = normalKey(event.key);
    if (['w','a','s','d',' ','arrowup','arrowdown','arrowleft','arrowright'].includes(key) && document.activeElement !== characterNameInput) event.preventDefault();
    if (document.activeElement === characterNameInput) return;
    if (key === ' ' && !event.repeat) { keys.space = true; startJump(); return; }
    if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(key)) {
      keys[key] = true;
      updateFacing(getInput());
    }
  }, { passive: false });
  window.addEventListener('keyup', event => {
    const key = normalKey(event.key);
    keys[key === ' ' ? 'space' : key] = false;
  });
  window.addEventListener('blur', () => {
    Object.keys(keys).forEach(k => keys[k] = false);
    joy.x = joy.y = 0;
    joy.active = false;
    joy.pointerId = null;
    joystickKnob.style.transform = 'translate(-50%, -50%)';
  });

  function setJoystickFromPointer(event) {
    const rect = joystick.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const maxRadius = rect.width * 0.34;
    let dx = event.clientX - cx;
    let dy = event.clientY - cy;
    const length = Math.hypot(dx, dy);
    if (length > maxRadius) { dx = dx / length * maxRadius; dy = dy / length * maxRadius; }
    joy.x = dx / maxRadius;
    joy.y = dy / maxRadius;
    joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    updateFacing(getInput());
  }
  joystick.addEventListener('pointerdown', event => {
    unlockAudio();
    event.preventDefault();
    joy.active = true;
    joy.pointerId = event.pointerId;
    try { joystick.setPointerCapture(event.pointerId); } catch (_) {}
    setJoystickFromPointer(event);
  });
  joystick.addEventListener('pointermove', event => {
    if (joy.active && event.pointerId === joy.pointerId) {
      event.preventDefault();
      setJoystickFromPointer(event);
    }
  });
  function releaseJoystick(event) {
    if (!joy.active || (event && event.pointerId !== undefined && event.pointerId !== joy.pointerId)) return;
    joy.active = false;
    joy.pointerId = null;
    joy.x = joy.y = 0;
    joystickKnob.style.transform = 'translate(-50%, -50%)';
  }
  joystick.addEventListener('pointerup', releaseJoystick);
  joystick.addEventListener('pointercancel', releaseJoystick);
  joystick.addEventListener('lostpointercapture', releaseJoystick);
  jumpButton.addEventListener('pointerdown', event => { unlockAudio(); event.preventDefault(); startJump(); });
  characterNameInput.addEventListener('keydown', event => event.stopPropagation());
  jumpButton.addEventListener('contextmenu', event => event.preventDefault());

  function getSpriteHeight() {
    // Larger character, while preserving the 954x1184 image ratio. The sprite
    // gets distinctly larger as its depth position approaches the camera.
    const base = Math.min(viewH * 0.46, viewW * 0.69);
    return base * (0.76 + player.y * 0.66);
  }

  let previousTime = performance.now();
  function frame(now) {
    const dt = Math.min((now - previousTime) / 1000, 0.04);
    previousTime = now;
    const input = getInput();
    if (Math.abs(input.x) > 0.08 || Math.abs(input.y) > 0.08) updateFacing(input);
    player.x = Math.max(MIN_X, Math.min(MAX_X, player.x + input.x * MOVE_SPEED_X * dt));
    player.y = Math.max(MIN_Y, Math.min(MAX_Y, player.y + input.y * MOVE_SPEED_Y * dt));

    let jumpProgress = 0, jumpOffset = 0;
    if (player.jumping) {
      jumpProgress = Math.min(1, (now - player.jumpStarted) / player.jumpDuration);
      jumpOffset = Math.sin(jumpProgress * Math.PI) * Math.min(viewH * 0.13, getSpriteHeight() * 0.48);
      if (jumpProgress >= 1) player.jumping = false;
    }

    ctx.clearRect(0, 0, viewW, viewH);
    const bg = images.baseplate;
    if (bg && bg.complete && bg.naturalWidth > 0) {
      // Cover the viewport without distorting the original 2000x1500 baseplate.
      const scale = Math.max(viewW / bg.naturalWidth, viewH / bg.naturalHeight);
      const bw = bg.naturalWidth * scale, bh = bg.naturalHeight * scale;
      ctx.drawImage(bg, (viewW - bw) / 2, (viewH - bh) / 2, bw, bh);
    } else {
      // Keep a plain background while the real baseplate PNG loads; no placeholder art.
      ctx.fillStyle = '#151a22';
      ctx.fillRect(0, 0, viewW, viewH);
    }

    const spriteHeight = getSpriteHeight();
    const spriteWidth = spriteHeight * (954 / 1184);
    const cx = player.x * viewW;
    const groundY = player.y * viewH;
    const shadowScale = 1 - (jumpOffset / Math.max(1, viewH * 0.13)) * 0.42;
    ctx.save();
    ctx.globalAlpha = 0.30 * Math.max(0.45, shadowScale);
    ctx.fillStyle = '#172018';
    ctx.beginPath();
    ctx.ellipse(cx, groundY + 2, spriteWidth * 0.34 * shadowScale, Math.max(3, spriteHeight * 0.035 * shadowScale), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    let spriteKey = player.facing;
    if (player.jumping) spriteKey = player.jumpFacing === 'back' ? 'jumpBack' : 'jumpFront';
    const sprite = images[spriteKey];
    if (sprite && sprite.complete && sprite.naturalWidth > 0) {
      ctx.drawImage(sprite, cx - spriteWidth / 2, groundY - jumpOffset - spriteHeight, spriteWidth, spriteHeight);
    }

    const displayName = (characterNameInput.value || '').trim().slice(0, 20);
    if (displayName && sprite && sprite.complete && sprite.naturalWidth > 0) {
      const nameY = groundY - jumpOffset - spriteHeight - Math.max(10, spriteHeight * 0.045);
      ctx.save();
      ctx.font = `600 ${Math.max(12, Math.min(22, spriteHeight * 0.075))}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(0,0,0,.8)';
      ctx.lineWidth = 4;
      ctx.strokeText(displayName, cx, nameY);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(displayName, cx, nameY);
      ctx.restore();
    }

    const walking = Math.hypot(input.x, input.y) > 0.08;
    updateWalkSound(walking);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
